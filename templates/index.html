<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Montagne & Paesi · Control Center</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ app_version }}">
</head>
<body>
  <header class="topbar">
    <div class="topwrap">
      <div class="brand">
        <div class="logo">M&amp;P</div>
        <div><h1>Control Center <span class="app-version">v{{ app_version }}</span></h1><p class="subtitle">Automazioni di Montagne &amp; Paesi</p></div>
      </div>
      <div class="sp"></div>
      <div class="summary"><span id="global-dot" class="dot pending"></span><div><strong id="global-status">Caricamento…</strong><small id="updated"></small></div></div>
      <button class="ghost" id="reload" title="Aggiorna ora">⟳</button>
      <a class="ghost" href="/impostazioni">⚙ Impostazioni</a>
    </div>
  </header>
  <main>
    <section class="chips" id="chips"></section>
    <section id="grid" class="grid"></section>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-head">
        <div class="icon"></div>
        <div class="head-text"><h2><span class="service-name"></span><span class="title-count" hidden></span></h2><p class="description"></p></div>
        <span class="pill"><i></i><span class="pill-text"></span></span>
      </div>
      <div class="kpis"></div>
      <div class="last" hidden>
        <div class="last-img"></div>
        <div class="last-body"><span class="label last-label"></span><a class="last-title" target="_blank" rel="noopener"></a><span class="last-when"></span></div>
      </div>
      <div class="queue" hidden><span class="label">PROSSIMI IN CODA</span><ul></ul></div>
      <div class="errors" hidden><span class="label">DA CONTROLLARE</span><ul></ul></div>
      <ul class="notes"></ul>
      <div class="log" hidden><span class="label">ULTIME ATTIVITÀ</span><ul></ul></div>
      <div class="card-foot"><span class="container-state"></span><a class="button" target="_blank" rel="noopener">Apri pannello ↗</a></div>
    </article>
  </template>
  <script src="{{ url_for('static', filename='app.js') }}?v={{ app_version }}"></script>
</body>
</html>
